<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Portal de Integridad de Entes</title>

    <!--
    ============================================
    CREDENCIALES POR DEFECTO (QUEMADAS EN EL SISTEMA)
    ============================================
    Usuario: admin
    Contraseña: admin123

    Usuario: usuario
    Contraseña: usuario123

    Usuario: morgan
    Contraseña: morgan2024
    ============================================
    -->

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN" crossorigin="anonymous">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">

    <style>
        :root {
            /* Microsoft Fluent UI Colors */
            --ms-blue: #0078d4;
            --ms-blue-dark: #005a9e;
            --ms-blue-light: #106ebe;
            --ms-gray-10: #faf9f8;
            --ms-gray-20: #f3f2f1;
            --ms-gray-30: #edebe9;
            --ms-gray-40: #e1dfdd;
            --ms-gray-100: #c8c6c4;
            --ms-gray-400: #605e5c;
            --ms-gray-600: #323130;
            --ms-gray-700: #201f1e;
            --ms-error: #d13438;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', 'Segoe UI Web (West European)', 'Segoe UI', -apple-system, BlinkMacSystemFont, 'Roboto', 'Helvetica Neue', sans-serif;
            background: linear-gradient(135deg, #f3f2f1 0%, #edebe9 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1rem;
        }

        .login-container {
            background: white;
            border-radius: 4px;
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.15), 0 2px 4px rgba(0, 0, 0, 0.12);
            width: 100%;
            max-width: 420px;
            padding: 3rem 2.5rem;
            border: 1px solid var(--ms-gray-30);
        }

        .login-header {
            text-align: center;
            margin-bottom: 2rem;
        }

        .login-logo {
            width: 72px;
            height: 72px;
            background: linear-gradient(135deg, var(--ms-blue) 0%, var(--ms-blue-light) 100%);
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 1.5rem;
            color: white;
            font-size: 2.25rem;
            box-shadow: 0 4px 8px rgba(0, 120, 212, 0.3);
        }

        .login-title {
            font-size: 1.75rem;
            font-weight: 600;
            color: var(--ms-gray-700);
            margin-bottom: 0.5rem;
            letter-spacing: -0.5px;
        }

        .login-subtitle {
            font-size: 0.875rem;
            color: var(--ms-gray-400);
            font-weight: 400;
        }

        .form-label {
            font-weight: 600;
            color: var(--ms-gray-700);
            margin-bottom: 0.375rem;
            font-size: 0.875rem;
        }

        .form-control {
            border-radius: 4px;
            border: 1.5px solid var(--ms-gray-100);
            padding: 0.625rem 0.875rem 0.625rem 2.5rem;
            transition: all 0.2s cubic-bezier(0.1, 0.9, 0.2, 1);
            background-color: white;
            font-size: 0.875rem;
            font-family: 'Segoe UI', sans-serif;
            height: 42px;
        }

        .form-control:focus {
            border-color: var(--ms-blue);
            box-shadow: 0 0 0 2px rgba(0, 120, 212, 0.2);
            outline: none;
        }

        .form-control:hover {
            border-color: var(--ms-gray-200);
        }

        .form-control.is-invalid {
            border-color: var(--ms-error);
        }

        .form-control.is-invalid:focus {
            box-shadow: 0 0 0 1px var(--ms-error);
        }

        .invalid-feedback {
            display: block;
            color: var(--ms-error);
            font-size: 0.75rem;
            margin-top: 0.25rem;
        }

        .btn-login {
            width: 100%;
            background-color: var(--ms-blue);
            border-color: var(--ms-blue);
            color: white;
            border-radius: 4px;
            padding: 0.75rem 1rem;
            font-weight: 600;
            font-size: 0.9375rem;
            transition: all 0.2s cubic-bezier(0.1, 0.9, 0.2, 1);
            border: 1px solid transparent;
            height: 44px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            box-shadow: 0 2px 4px rgba(0, 120, 212, 0.2);
        }

        .btn-login:hover {
            background-color: var(--ms-blue-light);
            border-color: var(--ms-blue-light);
            box-shadow: 0 4px 8px rgba(0, 120, 212, 0.3);
            transform: translateY(-1px);
        }

        .btn-login:active {
            background-color: var(--ms-blue-dark);
            border-color: var(--ms-blue-dark);
            transform: translateY(0);
        }

        .login-footer {
            text-align: center;
            margin-top: 2rem;
            padding-top: 1.5rem;
            border-top: 1px solid var(--ms-gray-30);
        }

        .login-footer-text {
            font-size: 0.75rem;
            color: var(--ms-gray-400);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
        }

        .input-group {
            position: relative;
            margin-bottom: 1.25rem;
        }

        .input-group:last-of-type {
            margin-bottom: 1.5rem;
        }

        .input-group .form-control {
            width: 100%;
        }

        .input-group .form-control {
            max-width: 100%;
            width: 100%;
        }

        .input-icon {
            position: absolute;
            left: 0.875rem;
            top: 50%;
            transform: translateY(-50%);
            color: var(--ms-gray-400);
            pointer-events: none;
            font-size: 1rem;
            z-index: 1;
        }

        .alert {
            border-radius: 4px;
            border: 1px solid;
            padding: 0.875rem 1rem;
            margin-bottom: 1.25rem;
            font-size: 0.875rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .alert-danger {
            background-color: #fef6f6;
            border-color: var(--ms-error);
            color: var(--ms-error);
        }

        @media (max-width: 480px) {
            .login-container {
                padding: 1.5rem;
            }
        }
    </style>
</head>

<body>
    <div class="login-container">
        <div class="login-header">
            <div class="login-logo">
                <i class="bi bi-shield-check"></i>
            </div>
            <h1 class="login-title">Portal de Integridad de Entes</h1>
            <p class="login-subtitle">Data Engineering - Morgan & Morgan</p>
        </div>

        <form id="loginForm">
            <div id="errorAlert" class="alert alert-danger" style="display: none;" role="alert">
                <i class="bi bi-exclamation-triangle"></i> Credenciales incorrectas. Por favor, intente nuevamente.
            </div>

            <div class="input-group">
                <i class="bi bi-person input-icon"></i>
                <input type="text" class="form-control" id="username" placeholder="Usuario" required
                    autocomplete="username">
            </div>

            <div class="input-group">
                <i class="bi bi-lock input-icon"></i>
                <input type="password" class="form-control" id="password" placeholder="Contraseña" required
                    autocomplete="current-password">
            </div>

            <button type="submit" class="btn btn-login">
                <i class="bi bi-box-arrow-in-right"></i> Iniciar Sesión
            </button>
        </form>


        <div class="login-footer">
            <p class="login-footer-text">
                <i class="bi bi-shield-lock"></i> Sistema seguro - Acceso autorizado únicamente
            </p>
        </div>
    </div>

    <!-- Bootstrap 5 JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-C6RzsynM9kWDrMNeT87bh95OGNyZPhcTNXj1NW7RuBCsyN/o0jlpcV8Qyq46cDfL"
        crossorigin="anonymous"></script>

    <script>
        // Verificar si ya hay una sesión activa
        if (localStorage.getItem('isAuthenticated') === 'true') {
            window.location.href = 'index.html';
        }

        // Manejar el envío del formulario
        document.getElementById('loginForm').addEventListener('submit', function (e) {
            e.preventDefault();

            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;
            const errorAlert = document.getElementById('errorAlert');

            // Ocultar error previo
            errorAlert.style.display = 'none';

            // Validación básica (en producción esto se haría contra un servidor)
            // Credenciales de ejemplo para demo
            const validUsers = {
                'admin': 'admin123',
                'usuario': 'usuario123',
                'morgan': 'morgan2024'
            };

            if (validUsers[username] && validUsers[username] === password) {
                // Guardar sesión
                localStorage.setItem('isAuthenticated', 'true');
                localStorage.setItem('username', username);
                localStorage.setItem('loginTime', new Date().toISOString());

                // Redirigir al sistema principal
                window.location.href = 'index.html';
            } else {
                // Mostrar error
                errorAlert.style.display = 'block';
                document.getElementById('password').value = '';
                document.getElementById('password').focus();
            }
        });

        // Enter key para enviar formulario
        document.getElementById('password').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') {
                document.getElementById('loginForm').dispatchEvent(new Event('submit'));
            }
        });
    </script>
</body>

</html>
